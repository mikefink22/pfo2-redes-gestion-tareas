<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis tareas</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { margin-bottom: .25rem; }
    ul { padding-left: 1.2rem; }
    li { margin: .35rem 0; }
    .hecha { text-decoration: line-through; color: #6b7280; }
    .vacio { color: #6b7280; }
  </style>
</head>
<body>
  <h1>¡Bienvenido, {{ usuario }}!</h1>
  <p>Estas son tus tareas:</p>
  {% if tareas %}
    <ul>
      {% for t in tareas %}
        <li class="{{ 'hecha' if t.completada else '' }}">{{ t.titulo }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="vacio">Todavía no tenés tareas.</p>
  {% endif %}
</body>
</html>
